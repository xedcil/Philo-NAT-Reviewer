<script>
var D=[{"n": 1, "s": ["Phil and Sophie have been in a romantic relationship for three years. Their relationship is known to their respective families and friends. Everyone expects that sooner or later they will get married. One evening, Sophie's best friend, Alithea, saw Phil at a mall with another woman. They were holding hands while looking at the mall displays. Alithea immediately called Sophie to tell her what she saw.", "Next morning, Alithea went to Sophie's house to check how she was doing. Sophie told her that she talked to Phil. He admitted that he has another girlfriend and that he loves this woman. Phil, however, insisted that he also loves Sophie. Alithea was so angry that he called Phil on the phone and shouted at him. She told him that he is so evil for doing that to her best friend and that he deserves to go to hell like all “two-timers\". She hung up the phone and congratulated Sophie for getting rid of an unfaithful man from her life. To Alithea's surprise, Sophie told her that she did not break up with Phil and that she has no intention to do so. She explained that it is natural for people to feel love and fall in love and that the idea that a person should only fall in love and have a romantic relationship with just one person is simply a social construct."], "q": "Why was Alithea angry at Phil?", "c": ["She thinks that Phil does not deserve Sophie.", "She has confirmed her suspicion that Phil is a womanizer.", "She believes that it is not right for someone to fall in love with more than one person.", "She does not trust Phil and thinks that he will not be the best person to be in a relationship with her best friend, Sophie."], "k": 2, "p": 2, "y": "Her insult exposes the assumption beneath her anger: loving more than one person is wrong.", "t": ["Too personal", "Unsupported label", "Reads in a motive"]}, {"n": 2, "s": ["Phil and Sophie have been in a romantic relationship for three years. Their relationship is known to their respective families and friends. Everyone expects that sooner or later they will get married. One evening, Sophie's best friend, Alithea, saw Phil at a mall with another woman. They were holding hands while looking at the mall displays. Alithea immediately called Sophie to tell her what she saw.", "Next morning, Alithea went to Sophie's house to check how she was doing. Sophie told her that she talked to Phil. He admitted that he has another girlfriend and that he loves this woman. Phil, however, insisted that he also loves Sophie. Alithea was so angry that he called Phil on the phone and shouted at him. She told him that he is so evil for doing that to her best friend and that he deserves to go to hell like all “two-timers\". She hung up the phone and congratulated Sophie for getting rid of an unfaithful man from her life. To Alithea's surprise, Sophie told her that she did not break up with Phil and that she has no intention to do so. She explained that it is natural for people to feel love and fall in love and that the idea that a person should only fall in love and have a romantic relationship with just one person is simply a social construct."], "q": "Why didn't Sophie break up.with Phil?", "c": ["She cannot live her life without Phil by her side.", "She does not want three years of her life to go to waste.", "She understands that Phil is acting on his natural inclination to love.", "She believes that it should be the other woman who should break up with Phil."], "k": 2, "p": 2, "y": "Sophie treats love as a natural inclination, so Phil’s act is not betrayal to her.", "t": ["Not her reason", "Sunk cost", "Blames another"]}, {"n": 3, "s": ["Phil and Sophie have been in a romantic relationship for three years. Their relationship is known to their respective families and friends. Everyone expects that sooner or later they will get married. One evening, Sophie's best friend, Alithea, saw Phil at a mall with another woman. They were holding hands while looking at the mall displays. Alithea immediately called Sophie to tell her what she saw.", "Next morning, Alithea went to Sophie's house to check how she was doing. Sophie told her that she talked to Phil. He admitted that he has another girlfriend and that he loves this woman. Phil, however, insisted that he also loves Sophie. Alithea was so angry that he called Phil on the phone and shouted at him. She told him that he is so evil for doing that to her best friend and that he deserves to go to hell like all “two-timers\". She hung up the phone and congratulated Sophie for getting rid of an unfaithful man from her life. To Alithea's surprise, Sophie told her that she did not break up with Phil and that she has no intention to do so. She explained that it is natural for people to feel love and fall in love and that the idea that a person should only fall in love and have a romantic relationship with just one person is simply a social construct."], "q": "If Alithea is as reflective as Sophie, it is likely that:", "c": ["she will not call Sophie to tell her about what she saw.", "she will investigate and gather evidence against Phil's infidelity.", "she will approach Phil and the woman at the mall and confront them herself.", "she will not be quick to judge Phil and other people in similar situations as evil."], "k": 3, "p": 2, "y": "Being reflective means suspending judgment: she would stop calling Phil, and others like him, evil.", "t": ["Avoidance", "Prosecuting", "Confronting"]}, {"n": 4, "s": ["You are watching your favorite anime with your younger sibling. A news flash comes up, which features the President's war on drugs. According to the President, drug pushers are not humans because they ruin people and families. Therefore, drug pushers should be killed. Your sibling asks you, “We were taught in school that killing is wrong, is it right to kill people if they are drug pushers?”"], "q": "If you were a philosophy student, how would you respond to your sibling's question?", "c": ["Tell your sibling to just focus on watching amine.", "Call your parents and ask them to answer your sibling's question.", "Keep quiet and pretend that you did not hear what your sibling's question.", "Ask your sibling what s/he means by “killing is wrong\" to establish a common understanding of what you will talk about."], "k": 3, "p": 0, "y": "Ask what “wrong” means first so both of you discuss the same thing.", "t": ["Avoidance", "Passing the buck", "Silence"]}, {"n": 5, "s": ["You are watching your favorite anime with your younger sibling. A news flash comes up, which features the President's war on drugs. According to the President, drug pushers are not humans because they ruin people and families. Therefore, drug pushers should be killed. Your sibling asks you, “We were taught in school that killing is wrong, is it right to kill people if they are drug pushers?”"], "q": "How would you proceed to discuss the morality. of killing in an unbiased way?", "c": ["Tell your sibling about your personal view on killing", "Get a sacred text (Bible, Quran, etc.) and read pässages from there about killing", "Ask your sibling to give éxamples of killing and ask him/her which of the examples can be considered right or wrong.", "Share to your sibling the bad effects of drug abuse (theft, rape, death, etc.) and ask her what she thinks about getting rid of all drug pushers in order to prevent these bad consequences."], "k": 2, "p": 0, "y": "Examples let the sibling reason from cases without you imposing a view.", "t": ["Imposing a view", "Appeal to authority", "Loaded framing"]}, {"n": 6, "s": ["You are watching your favorite anime with your younger sibling. A news flash comes up, which features the President's war on drugs. According to the President, drug pushers are not humans because they ruin people and families. Therefore, drug pushers should be killed. Your sibling asks you, “We were taught in school that killing is wrong, is it right to kill people if they are drug pushers?”"], "q": "If we are to accept the proposition that killing drug pushers is wrong, then how can we mitigate or eradicate drug abuse in the Philippines?", "c": ["Impose higher taxes so that people will have lesser money to buy illegal drugs.", "Legislate laws that will increase the penalty of drug trafficking in the Philippines", "Legalize the use of marijuana, shabu, cocaine, and the like in the Philippines.", "Step up to prevent entry and manufacturing of drugs inside the country to rehabilitate drug addicts."], "k": 3, "p": 6, "y": "Accepting that killing is wrong, the consistent response is prevention and rehabilitation.", "t": ["Off-target", "Punitive", "Overreach"]}, {"n": 7, "s": ["Phio and Sollie are classmates. One day, their class organized a “Bring Your Parents to School Day\". Some students were asked by the teacher to introduce their parents to the class. The first one to go was Phio. Phio went to the front, pointed at his parents who were standing at the back of the room and introduced them. Phio's father is a doctor while his mother is a pharmacist. Everyone clapped their hands after Phio's introduction. .", "The next student that was called was Sollie. Sollie's parents manage a family business. They were also standing at the back of the class so Sollie also had to point at their direction. However, her classmates were confused because she was pointing at two women. It turns out the Sollie was adopted by a lesbian couple. Thus, she has two mothers, but'no father. At this point, one of her classmates asked, “How can you say that you are a family if you do not have a father?”"], "q": "If you were Sollie, what would you do in the given situation?", "c": ["Explain that not all families are composed of father, mother, and children.", "Tell your classmates that you have a better family even if you don't have a father.", "Tell your classmates that your parents can stand as both father and mother figure for you.", "Point out that a family is more than biological relations, but more importantly, it is a support system bonded together by love, acceptance, and communication."], "k": 3, "p": 3, "y": "A family is bonded by care, a wider concept than biology or parent roles.", "t": ["Partial answer", "Defensive", "Keeps the father-mother frame"]}, {"n": 8, "s": ["Phio and Sollie are classmates. One day, their class organized a “Bring Your Parents to School Day\". Some students were asked by the teacher to introduce their parents to the class. The first one to go was Phio. Phio went to the front, pointed at his parents who were standing at the back of the room and introduced them. Phio's father is a doctor while his mother is a pharmacist. Everyone clapped their hands after Phio's introduction. .", "The next student that was called was Sollie. Sollie's parents manage a family business. They were also standing at the back of the class so Sollie also had to point at their direction. However, her classmates were confused because she was pointing at two women. It turns out the Sollie was adopted by a lesbian couple. Thus, she has two mothers, but'no father. At this point, one of her classmates asked, “How can you say that you are a family if you do not have a father?”"], "q": "If you were the class adviser, how would you ensure that Solie will not be hated, teased, or bullied due to her family background?", "c": ["Let the class figure out by themselves how they will deal with the situation.", "Redirect the attention of the class to other things like how good they are in organizing events.", "Conduct a community of inquiry with the class to discuss the notion of \"family”in order to deepen their understanding of what it is.", "Scold Sollie because had she told you beforehand about her family situation, then you would not have called her in front."], "k": 2, "p": 2, "y": "A community of inquiry replaces teasing with shared understanding.", "t": ["Neglect", "Distraction", "Blames the victim"]}, {"n": 9, "s": ["Phio and Sollie are classmates. One day, their class organized a “Bring Your Parents to School Day\". Some students were asked by the teacher to introduce their parents to the class. The first one to go was Phio. Phio went to the front, pointed at his parents who were standing at the back of the room and introduced them. Phio's father is a doctor while his mother is a pharmacist. Everyone clapped their hands after Phio's introduction. .", "The next student that was called was Sollie. Sollie's parents manage a family business. They were also standing at the back of the class so Sollie also had to point at their direction. However, her classmates were confused because she was pointing at two women. It turns out the Sollie was adopted by a lesbian couple. Thus, she has two mothers, but'no father. At this point, one of her classmates asked, “How can you say that you are a family if you do not have a father?”"], "q": "How would you help your classmates understand Sollie's situation?", "c": ["Approach your teacher and ask her to help Sollie.", "Share Sollie's story to your parents and listen to their insights about it.", "Cite instances that they consider their pets, best friends and relatives as family", "Keep quiet to prevent being associated with Sollie in case your classmates decide to tease her."], "k": 2, "p": 3, "y": "Pets, friends and relatives we call family show the concept is broader than structure.", "t": ["Hands it off", "Hearsay", "Self-protection"]}, {"n": 10, "s": ["In one of Philosophy classes, Ludwig learned that according to Plato, human beings are ensouled. Meanwhile, he also learned in his Religion class that various religions have different teachings on what happens to the soul when a person dies. Some say that it will go to heaven/hell; for others, it will be reincarnated; while there are also a few that claim that the soul will be one with nature.", "However, Ludwig believes that when a person dies there is just nothingness. This means that consciousness will cease to exist. In other words, he believes that a person's soul will neither go to heaven or hell because there is no such place nor will it be reincarnated. After he shared his belief in class, he noticed that some of his classmates started avoiding him and whispered to one another whenever he passed ·by."], "q": "Why did Ludwig's classmates suddenly change their attitude towards him?", "c": ["They hate Ludwig.", "They think Ludwig is an atheist.", "They do not understand Ludwig because his belief is different.", "They see Ludwig as weird because he does not believe in life after death."], "k": 3, "p": 2, "y": "The text shows only that they avoid him; the best-supported reason is that his belief seems strange to them.", "t": ["Overstated", "Label not in text", "Vague"]}, {"n": 11, "s": ["In one of Philosophy classes, Ludwig learned that according to Plato, human beings are ensouled. Meanwhile, he also learned in his Religion class that various religions have different teachings on what happens to the soul when a person dies. Some say that it will go to heaven/hell; for others, it will be reincarnated; while there are also a few that claim that the soul will be one with nature.", "However, Ludwig believes that when a person dies there is just nothingness. This means that consciousness will cease to exist. In other words, he believes that a person's soul will neither go to heaven or hell because there is no such place nor will it be reincarnated. After he shared his belief in class, he noticed that some of his classmates started avoiding him and whispered to one another whenever he passed ·by."], "q": "Based on the text, what would be the most probable reason as to how Ludwig arrived at his belief?", "c": ["He believes that there should have proofs and evidences before claiming the truth.", "He thought that his view has the least assumptions and, therefore, is more likely to be true.", "He got tired of the different teachings of religions so he settled at the belief that there is no life after death.", "He saw a documentary of someone who was declared clinically dead but was later on revived stating that there was just nothingness upon death."], "k": 0, "p": 1, "y": "His claim of nothingness is best explained by demanding proof before accepting claims; the text gives no documentary or fatigue.", "t": ["Plausible, unstated", "Unsupported", "Invented evidence"]}, {"n": 12, "s": ["In one of Philosophy classes, Ludwig learned that according to Plato, human beings are ensouled. Meanwhile, he also learned in his Religion class that various religions have different teachings on what happens to the soul when a person dies. Some say that it will go to heaven/hell; for others, it will be reincarnated; while there are also a few that claim that the soul will be one with nature.", "However, Ludwig believes that when a person dies there is just nothingness. This means that consciousness will cease to exist. In other words, he believes that a person's soul will neither go to heaven or hell because there is no such place nor will it be reincarnated. After he shared his belief in class, he noticed that some of his classmates started avoiding him and whispered to one another whenever he passed ·by."], "q": "How would. you evaluate Ludwig's belief?", "c": ["true", "opinion", "superstitious", "atheistic"], "k": 1, "p": 1, "y": "It cannot be verified, so it is a belief or opinion, not established truth.", "t": ["Unproven as true", "Mislabel", "A label, not an evaluation"]}, {"n": 13, "s": ["During the Philosophy class, Philip and Sonia were debating on the concept, tao. Philip argues that tao is a species of homo sapiens, has opposable thumbs, and has the capacity to think. Sonia, on the other hand, insists that tao is more than just their biological and physiological characteristics but a collection of experiences, beliefs, and emotions, has dignity, morals, rights, and obligations. The two rebutted each other for the duration of the period. In the end, the debate ended without them resolving anything."], "q": "Why do you think Philip and Sonia did not resolve anything?", "c": ["Both of them were wrong in their beliefs.", "It is a debate, so there is only one side has to win.", "Philip and Sonia have different views about the notion of tao.", "They were competing with each other, so only one has to win."], "k": 2, "p": 3, "y": "They talk past each other because each means something different by tao.", "t": ["False verdict", "Debate-to-win", "Competition"]}, {"n": 14, "s": ["During the Philosophy class, Philip and Sonia were debating on the concept, tao. Philip argues that tao is a species of homo sapiens, has opposable thumbs, and has the capacity to think. Sonia, on the other hand, insists that tao is more than just their biological and physiological characteristics but a collection of experiences, beliefs, and emotions, has dignity, morals, rights, and obligations. The two rebutted each other for the duration of the period. In the end, the debate ended without them resolving anything."], "q": "The next meeting, the teacher gave Sonia and Philip another chance to resolve the issue. What should they do to settle the debate?", "c": ["Engage in collaborative thinking to arrive at a common understanding of the term.", "Pick up where they left off and continue refuting each other's points.", "Tell the teacher to just choose other students to continue the debate.", "Invite experts to settle the issue."], "k": 0, "p": 3, "y": "Shared thinking builds one fuller definition from both views.", "t": ["Repeating the fight", "Escape", "Outsourcing"]}, {"n": 15, "s": ["During the Philosophy class, Philip and Sonia were debating on the concept, tao. Philip argues that tao is a species of homo sapiens, has opposable thumbs, and has the capacity to think. Sonia, on the other hand, insists that tao is more than just their biological and physiological characteristics but a collection of experiences, beliefs, and emotions, has dignity, morals, rights, and obligations. The two rebutted each other for the duration of the period. In the end, the debate ended without them resolving anything."], "q": "How should we view the notion of tao?", "c": ["It is anyone and anything that looks like us and acts as we do", "It is a complex concept that goes beyond mere essential property.", "It is a rational animal, which implies that only thinking beings can be called tao.", "It is just a word that we use to refer to people and there is no point in understanding it."], "k": 1, "p": 3, "y": "Tao is richer than a list of essential properties; it includes experience and dignity.", "t": ["Resemblance only", "Too narrow", "Dismissive"]}, {"n": 16, "s": ["1. Humans have the capacity and intelligence to improve their lives by making tools.", "2. The planet where human beings live is called Earth.", "3. Humans are the only ones who can save the Earth and they have the obligation to do so.", "4. The Earth is slowly dying because its resources are constantly being abused by humans.32"], "q": "What is the core idea of the statements?", "c": ["Humans are smart and creative.", "Humans are destroying the Earth.", "Humans have the responsibility to take care of the environment.", "Humans should be more technologically advanced so as to make their lives better."], "k": 2, "p": 6, "y": "Statements 3 and 4 stress duty: humans can and must protect the Earth.", "t": ["Partial", "Partial", "Off-focus"]}, {"n": 17, "s": ["1. Humans have the capacity and intelligence to improve their lives by making tools.", "2. The planet where human beings live is called Earth.", "3. Humans are the only ones who can save the Earth and they have the obligation to do so.", "4. The Earth is slowly dying because its resources are constantly being abused by humans.32"], "q": "How would you classify the information presented?", "c": ["Moral", "Logical", "Scientific", "Theoretical"], "k": 0, "p": 1, "y": "The statements say what humans ought to do, so they are moral claims.", "t": ["Not argument form", "Not testable", "Not a theory"]}, {"n": 18, "s": ["1. Humans have the capacity and intelligence to improve their lives by making tools.", "2. The planet where human beings live is called Earth.", "3. Humans are the only ones who can save the Earth and they have the obligation to do so.", "4. The Earth is slowly dying because its resources are constantly being abused by humans.32"], "q": "Which is the most sensible order of the given statements?", "c": ["4-3-2-1", "3-2-1-4", "2-1-4-3", "1-4-3-2"], "k": 2, "p": 6, "y": "Earth’s place, human tools, the damage, then the duty: 2-1-4-3.", "t": ["Conclusion first", "Starts with duty", "Odd order"]}, {"n": 19, "s": ["1. A person is a subject of rights and obligations.", "2. The idea of a person can be considered as a social construct.", "3. Human beings are persons because they have the dignity of being created in the image and likeness of God.", "4.“Person” is a complicated idea that needs further conceptual analysis and clarification."], "q": "What is the point of the statements?", "c": ["Only human beings exist not human persons.", "The idea of person can be understood from different points of view.", "There is no such thing as person because it is not clear what a person really is.", "Only human beings are persons because we do not refer to objects as persons."], "k": 1, "p": 3, "y": "Together they give legal, social, religious and philosophical views of person.", "t": ["Denies persons", "Dismissive", "Too exclusive"]}, {"n": 20, "s": ["1. A person is a subject of rights and obligations.", "2. The idea of a person can be considered as a social construct.", "3. Human beings are persons because they have the dignity of being created in the image and likeness of God.", "4.“Person” is a complicated idea that needs further conceptual analysis and clarification."], "q": "Which among the given statements pertains to the legal point of view on “person\"?", "c": ["Statement 1", "Statement 2", " ": ["Not shown", "Not witnessed", "Partial evidence"]}, {"n": 35, "s": ["Peter was walking home from school when he heard a loud explosion followed by a scream coming from inside a vacant lot five meters away from where he was. He, then, saw someone go out of the vacant lot, running. Out of interest, Peter decided to enter the lot. Upon entering, he saw his classmate, Selah, lying on the ground with blood on her clothes. Peter immediately took out his mobile phone and called the police. He said that someone committed a. murder and it was a man."], "q": "Given the information in the text, can the police consider Peter as a credible source?", "c": ["Yes, because Peter was at the scene of the crime.", "Yes,because Peter saw everything that happened.", "No, because Peter did not see what actually happened.", "No,because Peter may be considered as a suspect as well."], "k": 2, "p": 5, "y": "He did not see the act, so his report is inference, not eyewitness testimony.", "t": ["Presence is not credibility", "Overclaims", "Suspicion is not evidence"]}, {"n": 36, "s": ["Peter was walking home from school when he heard a loud explosion followed by a scream coming from inside a vacant lot five meters away from where he was. He, then, saw someone go out of the vacant lot, running. Out of interest, Peter decided to enter the lot. Upon entering, he saw his classmate, Selah, lying on the ground with blood on her clothes. Peter immediately took out his mobile phone and called the police. He said that someone committed a. murder and it was a man."], "q": "In a case such as this, what is the criterion for an ideal witness?", "c": ["S/he should have seen what actually happened.", "S/he should have a clear idea of what happened.", "S/he should have heard what happened from someone else.", "S/he should have known of what will happen before it happened."], "k": 0, "p": 5, "y": "The ideal witness has direct sight of the event.", "t": ["Vague", "Hearsay", "Impossible"]}, {"n": 37, "s": ["P emains of the late Ferdinand Marcos, Sr. should be buried at the Libingan ng mga Bayani (LNMB). Primo argues that he should be buried at the LNMB' because according to the various Facebook posts of his friends, Marcos did a lot for the benefit of the Filipino people such as building bridges and attracting foreign investors. Selene, on the other hand, insists that Marcos should not be buried at the LNMB because various history books and archived news described the terrors that the Filipino people experienced during Martial Law."], "q": "What should be the criterion for a credible source of information in the given situation?", "c": ["The information should be based on the popular opinion of the people.", "The information should be based on the statements. of people who participated in the EDSA 1 Revolution.", "The information should be based on published texts that can be verified through research.", "The information should be based on the stories of parents, grandparents, and relatives who lived during the time of Marcos, Sr."], "k": 2, "p": 5, "y": "Verifiable published texts let anyone check the claim.", "t": ["Bandwagon", "One-sided", "Anecdote"]}, {"n": 40, "s": ["Pete is very conscioús about his health. He jogs every morning and goes to the gym every afternoon. He also watches what he eats in order to make sure that he only eats healthy food. However, because of the demands of work, he was not able to jog anymore or go to the gym. He also began to eat a lot so as to compensate for his lack of sleep. After some time, he noticed that he easily gets tired and is starting to get fat. He concluded that this is due to the fact that he has neglected to live an active lifestyle."], "q": "Why does Pete easily get tired and start to get fat?", "c": ["Pete is stressed with his work.", "Pete is sickly and has a weak body.", "Pete is nAot living an active lifestyle.", "Pete has genes that inevitably causes him to get fat."], "k": 2, "p": 6, "y": "The story itself names the rcise regularly.", "Go to the drugstore and buy"], "k": 2, "p": 6, "y": "A balanced diet and exercise treat the causes named.", "t": ["Doesn’t treat the cause", "Shortcut", "Shortcut"]}, {"n": 43, "s": ["Sandra wants to graduate with highest honors. She will do anything to come out as the top of her class. She spends sleepless nights studying her lessons and most of her free hours reading books. She exerts extra effort in every assignment and project that she does. A few days before her graduation, she found out her grades were not enlisted for the recognition she was aiming for. Sandra was very sad with the news and thought that everything she did was worthless. Sandra's class adviser noticed her sad demeanor and decided to talk to her. Sandra told her adviser the reason for her apparent sadness. Her adviser told her something thàt somehow made Sandra realize something. What her adviser told Sandra was this: “Your grades do not define you. What defines you is how much effort you put in everything you do. As long as you give your best, everything that you do is worthwhile.”"], "q": "How can you say that Sandra really wanted to graduate with the highest honors?", "c": ["She tried to befriend her teachers in order to get high grades.", "She exerts a lot of effort on her lessons and class requirements.", "She spends most of her time sleeping or watching movies.", "She ásks her parents to donate money to the school in order for them to make her class valedictorian."], "k": 1, "p": 6, "y": "Effort is the visible sign of desire; the others are shortcuts or the opposite.", "t": ["Currying favour", "Opposite", "Bribery"]}, {"n": 44, "s": ["Sandra wants to graduate with highest honors. She will do anything to come out as the top of her class. She spends sleepless nights studying her lessons and most of her free hours reading books. She exerts extra effort in every assignment and project that she does. A few days before her graduation, she found out her grades were not enlisted for the recognition she was aiming for. Sandra was very sad with the news and thought that everything she did was worthless. Sandra's class adviser noticed her sad demeanor and decided to talk to her. Sandra told her adviser the reason for her apparent sadness. Her adviser told her something thàt somehow made Sandra realize something. What her adviser told Sandra was this: “Your grades do not define you. What defines you is how much effort you put in everything you do. As long as you give your best, everything that you do is worthwhile.”"], "q": "What specific instances show that Sandra is intent on becoming top of her. class?", "c": ["Sandra asked her parents to enroll her in a review center.", "Sandra was very sad when she learned that she will not graduate as valedictorian.", "Sandra talked to her teacher to ask if the teacher can tutor her after class so that she can clarify what she did not understand during lectures.", "Sandra spends hours studying lessons, reading books, and accomplishing her class requirements."], "k": 3, "p": 6, "y": "Hours of studying, reading and finishing requirements are the specific actions in the text.", "t": ["Not in text", "Emotion, not action", "Not in text"]}, {"n": 45, "s": ["Sandra wants to graduate with highest honors. She will do anything to come out as the top of her class. She spends sleepless nights studying her lessons and most of her free hours reading books. She exerts extra effort in every assignment and project that she does. A few days before her graduation, she found out her grades were not enlisted for the recognition she was aiming for. Sandra was very sad with the news and thought that everything she did was worthless. Sandra's class adviser noticed her sad demeanor and decided to talk to her. Sandra told her adviser the reason for her apparent sadness. Her adviser told her something thàt somehow made Sandra realize something. What her adviser told Sandra was this: “Your grades do not define you. What defines you is how much effort you put in everything you do. As long as you give your best, everything that you do is worthwhile.”"], "q": "What does Sandra's story tell us?", "c": ["All efforts are bound to fail.", "Sometimes, you have to take shortcuts in order to succeed.", "Doing everything you can does not necessarily mean that you will get the results that you want.", "Try and try until you succeed is a motto that everyone must keep in mind in order to achieve their goals in life."], "k": 2, "p": 7, "y": "Effort does not guarantee the result; her story shows the gap.", "t": ["Overgeneralizing", "Endorses shortcuts", "Slogan"]}, {"n": 46, "s": ["Pablo and Sabrina are talking about the purpose of life. They are trying to answer the question, “Why are we here?\" Pablo argues that everything in the world exists for a reason. There is rain because the earth needs to be watered for plants to grow. The sun rises in the morning to give warmth, which is important to sustain life. He points out that everything we see around us has a purpose. On the other hand, Sabrina insists that, everything in the world may just be a random accident. She points out that although there is a very little possibility, it is still possible that everything that is happening around us, from the beginnings of the universe up to this point is one big accident - a stroke of luck. If this is the case, then there is no such thing as purpose. We are born. We grow old. We die. There may be no reason at all for anything and everything that is happening around us. She concludes that human beings only struggle to find purpose in order for them to fit in the world."], "q": "Is there an exact answer to the question, “Why are we here?”", "c": ["People can find it out in their own way and time.", "Yes, because everything in the world has a purpose just like the rain watering the earth and the sun giving warmth.", "No, because statistically speaking there is a possibility that human life is simply a random accident and we have no purpose in the world.", "Maybe, but finding the answer requires a great deal of philosophical reflection because the question deals with foundational truths."], "k": 3, "p": 7, "y": "The question needs serious reflection and may have no exact answer.", "t": ["Passive", "Assumes yes", "Assumes no"]}, {"n": 47, "s": ["Pablo and Sabrina are talking about the purpose of life. They are trying to answer the question, “Why are we here?\" Pablo argues that everything in the world exists for a reason. There is rain because the earth needs to be watered for plants to grow. The sun rises in the morning to give warmth, which is important to sustain life. He points out that everything we see around us has a purpose. On the other hand, Sabrina insists that, everything in the world may just be a random accident. She points out that although there is a very little possibility, it is still possible that everything that is happening around us, from the beginnings of the universe up to this point is one big accident - a stroke of luck. If this is the case, then there is no such thing as purpose. We are born. We grow old. We die. There may be no reason at all for anything and everything that is happening around us. She concludes that human beings only struggle to find purpose in order for them to fit in the world."], "q": "Why did Pablo conclude that everything in the world has a purpose?", "c": ["He believes that everything has uses and function.", "He cannot accept the idea that he is living a life without purpose.", "He thinks that the world is too complex in order for it to be simply dismissed as a stroke of luck.", "He sees purpose in everything that is happening around him, such as the falling of the rain and the rising of the sun."], "k": 3, "p": 7, "y": "Pablo points to what he sees: rain and sunrise as signs of purpose.", "t": ["Function only", "Personal need", "Not in text"]}, {"n": 48, "s": ["Pablo and Sabrina are talking about the purpose of life. They are trying to answer the question, “Why are we here?\" Pablo argues that everything in the world exists for a reason. There is rain because the earth needs to be watered for plants to grow. The sun rises in the morning to give warmth, which is important to sustain life. He points out that everything we see around us has a purpose. On the other hand, Sabrina insists that, everything in the world may just be a random accident. She points out that although there is a very little possibility, it is still possible that everything that is happening around us, from the beginnings of the universe up to this point is one big accident - a stroke of luck. If this is the case, then there is no such thing as purpose. We are born. We grow old. We die. There may be no reason at all for anything and everything that is happening around us. She concludes that human beings only struggle to find purpose in order for them to fit in the world."], "q": "What do Pablo and Sabrina's arguments tell us?", "c": ["Everything in life is certain, that is, what we see is what we get.", "Pablo and Sabrina want to tell that questions are meant to be answered.", "There are still a lot of things that we do not understand in the world and we must take interest in understanding them.", "There are many questions that are very difficult to answer and it will just be a waste of time to try to answer these kinds of questions."], "k": 2, "p": 7, "y": "Both arguments leave much unknown, so keep inquiring.", "t": ["Overcertain", "Too simple", "Gives up"]}];

function latest(){var m={};H.forEach(function(h){m[h.id]=h});return m}
function go(v){S.v=v;draw()}
function start(set){S.set=set;S.pos=0;S.sel=null;S.cf=null;S.done=false;S.v="quiz";draw()}
function nav(){return '<div class="nav"><button onclick="go(\'home\')">Home</button><button onclick="go(\'map\')">My patterns</button><button onclick="go(\'book\')">Mistake notebook</button></div>'}
function pick(n){if(S.done)return;S.sel=n;draw()}
function conf(n){S.cf=n;draw()}
function check(){var id=S.set[S.pos];H.push({id:id,ok:S.sel===D[id].k,cf:S.cf,t:[0,0,0]});sv();S.done=true;draw()}
function tick(i){var l=H[H.length-1];l.t[i]=l.t[i]?0:1;sv()}
function next(){if(S.pos<S.set.length-1){S.pos++;S.sel=null;S.cf=null;S.done=false;draw()}else go("map")}
function range(a){var r=[];for(var i=0;i<D.length;i++)if(a(D[i]))r.push(i);return r}
function home(){var h='<h1>Pilosopo</h1><p class="mut">NAT Philosophy trainer. 48 scenarios. Train the thinking, not just the answers. No typing needed: choose, rate your confidence, and tick your habits.</p><div class="card"><h2>Full mock</h2><button class="pri opt" onclick="start(range(function(){return 1}))">Start all 48 items</button></div><div class="card"><h2>Practice one thinking pattern</h2>';
PAT.forEach(function(p,i){var n=range(function(d){return d.p===i}).length;h+='<button class="opt" onclick="start(range(function(d){return d.p==='+i+'}))">'+p[0]+' <span class="mut">('+n+' items)</span></button>'});
return h+'</div>'+nav()+'<p class="mut">Works offline once installed. Progress is saved on this device.</p>'}
function quiz(){var id=S.set[S.pos],it=D[id],wr=[0,1,2,3].filter(function(n){return n!==it.k}),h='<p class="mut">Item '+it.n+' · '+(S.pos+1)+' of '+S.set.length+'</p><div class="card"><div class="scn">'+it.s.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div><h2 style="margin-top:14px">'+it.q+'</h2>';
it.c.forEach(function(t,n){var c="opt";if(S.done)c+=n===it.k?" ok":(n===S.sel?" no":"");else if(S.sel===n)c+=" sel";
var w=n===it.k?'Best answer. '+it.y:'Trap: '+it.t[wr.indexOf(n)];
h+='<button class="'+c+'" onclick="pick('+n+')">'+"ABCD"[n]+". "+t+(S.done?'<div class="why">'+w+'</div>':'')+'</button>'});
if(!S.done&&S.sel!==null){h+='<p class="mut">How sure are you?</p><div class="row">';CF.forEach(function(t,n){h+='<button class="'+(S.cf===n?'sel':'')+'" onclick="conf('+n+')">'+t+'</button>'});h+='</div>';if(S.cf!==null)h+='<button class="pri opt" onclick="check()">Check answer</button>'}
h+='</div>';
if(S.done){var l=H[H.length-1],pt=PAT[it.p];
if(!l.ok&&l.cf===0)h+='<div class="warn">You were sure, but this one was wrong. This is the most important kind of mistake to fix.</div>';
h+='<div class="pat"><b>Think like a philosopher: '+pt[0]+'</b><p>'+pt[1]+'</p><p class="mut">'+pt[2]+'</p></div><div class="card"><b>Habit check</b>';
TK.forEach(function(t,i){h+='<label><input type="checkbox" onchange="tick('+i+')"> '+t+'</label>'});
h+='</div><button class="pri opt" onclick="next()">'+(S.pos<S.set.length-1?"Next item":"See my patterns")+'</button>'}
return h+nav()}
function map(){var L=latest(),ids=Object.keys(L),tk=0,h='<h2>My thinking patterns</h2>';
ids.forEach(function(n){L[n].t.forEach(function(x){tk+=x})});
h+='<div class="card"><b>Habit ticks</b><div class="bar"><i style="width:'+(ids.length?Math.round(tk/(ids.length*3)*100):0)+'%"></i></div><span class="mut">'+tk+' of '+(ids.length*3)+' habits ticked. Aim to tick all three on every item.</span></div>';
PAT.forEach(function(pt,pi){var ok=0,d=0,tr=0,tot=range(function(x){return x.p===pi}).length;range(function(x){return x.p===pi}).forEach(function(n){if(L[n]){tr++;if(L[n].ok)ok++;else if(L[n].cf===0)d++}});
h+='<div class="card"><b>'+pt[0]+'</b><div class="bar"><i style="width:'+(tr?Math.round(ok/tr*100):0)+'%"></i></div><span class="mut">'+(tr?ok+' of '+tr+' correct, '+tot+' items in all':'Not tried yet, '+tot+' items')+(d?' · '+d+' sure but wrong':'')+'</span></div>'});
return h+nav()}
function book(){var L=latest(),w=Object.keys(L).filter(function(n){return !L[n].ok}).map(Number),h='<h2>Mistake notebook</h2>';
if(!w.length)return h+'<div class="card">No mistakes yet. Wrong answers collect here for review.</div>'+nav();
h+='<button class="pri opt" onclick="start('+JSON.stringify(w)+')">Retry my '+w.length+' mistakes</button>';
w.forEach(function(n){var it=D[n];h+='<div class="card"><p class="mut">Item '+it.n+' · '+PAT[it.p][0]+'</p><p>'+it.q+'</p><p><b>Best answer:</b> '+it.c[it.k]+'</p><p class="why">'+it.y+'</p></div>'});
return h+nav()}
function draw(){document.getElementById("app").innerHTML={home:home,quiz:quiz,map:map,book:book}[S.v]();window.scrollTo(0,0)}
draw();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script></body></html>
